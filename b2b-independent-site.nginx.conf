# ===============================================================
# 站点配置文件 (仅 server 块)
# 用途: 放入 /etc/nginx/sites-enabled/b2b-independent-site
# 用法: sudo cp b2b-independent-site.nginx.conf /etc/nginx/sites-available/b2b-independent-site
#       sudo sed -i 's/your-domain.com/YOUR_DOMAIN/g' /etc/nginx/sites-available/b2b-independent-site
#       sudo ln -sf /etc/nginx/sites-available/b2b-independent-site /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# 注意: 443 端口会引用 Let's Encrypt 证书。必须先申请证书，否则 nginx -t 会报
#       "cannot load certificate ... No such file or directory"。
#       申请方法（域名必须已解析到本服务器）:
#       sudo apt install -y certbot
#       sudo certbot certonly --webroot -w /var/www/b2b-independent-site/public \
#            -d YOUR_DOMAIN -d www.YOUR_DOMAIN --email YOU@EXAMPLE.COM --agree-tos --no-eff-email
#       申请成功后 /etc/letsencrypt/live/YOUR_DOMAIN/ 下会生成 fullchain.pem 和 privkey.pem，
#       再执行 nginx -t && systemctl reload nginx。
# ===============================================================

server {
  listen 80;
  server_name your-domain.com www.your-domain.com;

  # 保留 acme 验证路径（certbot webroot 方式需要），不受下面的 301 重定向影响
  location /.well-known/acme-challenge/ {
    root /var/www/b2b-independent-site/public;
  }

  location / {
    return 301 https://$server_name$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name your-domain.com www.your-domain.com;

  # 使用 Let's Encrypt 证书 (通过 certbot --nginx 自动生成)
  ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  location /_next/static {
    # 优先读本地文件系统（速度快），找不到时降级到 Node 代理
    try_files $uri @nextjs;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }

  location @nextjs {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  location /static/ {
    alias /var/www/b2b-independent-site/public/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  location /uploads/ {
    # $uri = /uploads/xxx → root + $uri = /var/www/b2b-independent-site/uploads/xxx (新上传)
    # /public$uri = /var/www/b2b-independent-site/public/uploads/xxx (旧上传)
    root /var/www/b2b-independent-site;
    try_files $uri /public$uri @fallback_uploads;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location @fallback_uploads {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
