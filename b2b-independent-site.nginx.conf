# ===============================================================
# 站点配置文件 (仅 server 块)
# 用途: 放入 /etc/nginx/sites-enabled/b2b-independent-site
# 推荐用法（自动替换域名、备份、校验、失败还原）:
#       cd /var/www/b2b-independent-site
#       bash scripts/install-nginx-conf.sh your-domain.com
#
# 注意: 443 端口会引用 Let's Encrypt 证书。必须先申请证书，否则 nginx -t 会报
#       "cannot load certificate ... No such file or directory"。
#       申请方法（域名必须已解析到本服务器）:
#       sudo apt install -y certbot
#       sudo certbot certonly --webroot -w /var/www/b2b-independent-site/public \
#            -d your-domain.com -d www.your-domain.com --email you@example.com --agree-tos --no-eff-email
#       申请成功后 /etc/letsencrypt/live/your-domain.com/ 下会生成 fullchain.pem 和 privkey.pem，
#       再执行 bash scripts/install-nginx-conf.sh your-domain.com。
#
# ===============================================================
# HTML 微缓存 (小机器 CPU 优化)
# Debian/Ubuntu 的 /etc/nginx/nginx.conf 会把 sites-enabled 里的文件 include 进
# http { } 块，所以这里可以声明 proxy_cache_path。若你的环境没有 include 进 http 块，
# 请把下面两行移到 /etc/nginx/nginx.conf 的 http { } 中，否则 nginx -t 会报错。
#
# ⚠️ 必须先创建缓存父目录，否则 nginx -t 会报：
#      mkdir() "/var/cache/nginx/b2b" failed (2: No such file or directory)
#    nginx 只会自动创建 proxy_cache_path 的末级目录，不会创建父目录：
#      sudo mkdir -p /var/cache/nginx/b2b
#      sudo chown -R www-data:www-data /var/cache/nginx
#    另注：Ubuntu 的 /etc/tmpfiles.d/ 会在重启时清理 /var/cache/nginx，
#    所以每次重启服务器后（或 nginx 报错找不到目录时）都要重新执行上面那两行。
proxy_cache_path /var/cache/nginx/b2b levels=1:2 keys_zone=b2b_core:64m
                 max_size=1g inactive=60m use_temp_path=off;

# 识别 RSC payload 响应（text/x-component）。正则不能直接写在 proxy_no_cache /
# proxy_cache_bypass 里（写 `$var ~* "..."` 会被当成永远为真的字面量，导致整个
# location 永久不缓存），必须先 map 成 0/1 再使用。
map $upstream_http_content_type $b2b_rsc_response {
  default 0;
  "~*text/x-component" 1;
}
# ===============================================================

server {
  listen 80;
  server_name your-domain.com www.your-domain.com;

  # 保留 acme 验证路径（certbot webroot 方式需要），不受下面的 301 重定向影响
  location /.well-known/acme-challenge/ {
    root /var/www/b2b-independent-site/public;
  }

  location / {
    return 301 https://$server_name$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name your-domain.com www.your-domain.com;

  # 使用 Let's Encrypt 证书 (通过 certbot --nginx 自动生成)
  ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

  # 上传图片可达 5MB（前端 ImageUploader 限制）。Nginx 默认 client_max_body_size 仅 1M，
  # 小于 1MB 的图直接返回 413 HTML 页面，前端 res.json() 会报 "Unexpected token '<'..."
  client_max_body_size 50M;

  # ---- Cloudflare 真实访客 IP ----
  # 不配这段时 $remote_addr 是 Cloudflare 边缘节点 IP，后台数据分析里每个访客
  # 显示的都是 Cloudflare 的 IP，且 geoip 查不到真实国家。
  # real_ip 模块把 CF-Connecting-IP（Cloudflare 保证写入真实访客 IP）写回
  # $remote_addr，后面 proxy_set_header X-Real-IP $remote_addr 就是真实访客 IP。
  # 官方 IP 段随时可能变动，改动后用下面两行核对：
  #   curl -s https://www.cloudflare.com/ips-v4 ; curl -s https://www.cloudflare.com/ips-v6
  # 注意：只信任 Cloudflare 的 IP 段，直连源站的请求不会被采信（也就无法伪造 IP）。
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # 默认代理超时（所有 location 继承）。
  # 之前用默认 60s：保存产品触发 AI 多语言翻译（/api 最长 300s）时客户端会收到
  # "504 Gateway Time-out"。这里放宽到 300s，/api 再放宽到 360s。
  proxy_connect_timeout 10s;
  proxy_send_timeout    300s;
  proxy_read_timeout    300s;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # ---- HTML 微缓存: 大幅降低双核小机器在爬虫/重复访问下的 CPU 占用 ----
    # 只缓存「匿名 + 普通浏览器整页 HTML」5 分钟；以下情况一律绕过：
    #   1. 非 GET（POST/PUT…）
    #   2. 客户端软导航发来的 RSC 流（带 RSC 请求头）
    #   3. 已登录用户（next-auth.session-token cookie）
    #   4. 带查询字符串（?sort=…&page=…，_rsc 也包含在内）
    #   5. 后台与个性化页面（admin/account/auth/cart/checkout/wishlist，含多语言前缀）
    #   6. 响应不是 HTML（严禁缓存 RSC payload: text/x-component）
    # 生效后可通过响应头 X-Cache-Status: HIT/MISS 验证。
    # 注意: 修改商品/页面后最长 5 分钟才在缓存里刷新（正常访客体验不受影响）。
    set $uncacheable 0;
    if ($request_method != GET) { set $uncacheable 1; }
    if ($http_rsc) { set $uncacheable 1; }
    if ($http_cookie ~* "next-auth\.session-token") { set $uncacheable 1; }
    if ($args) { set $uncacheable 1; }
    if ($request_uri ~* "^/(admin|account|auth|cart|checkout|wishlist)(/|$)|^/(en|zh|es|pt|fr|de|ru)/(account|auth|cart|checkout|wishlist)(/|$)") {
      set $uncacheable 1;
    }
    proxy_cache b2b_core;
    proxy_cache_key "$scheme$proxy_host$request_uri";
    proxy_cache_valid 200 302 5m;
    # 任一条件为真即不缓存：$uncacheable（见上方 set/if）或 $b2b_rsc_response（RSC payload）。
    proxy_cache_bypass $uncacheable $b2b_rsc_response;
    proxy_no_cache $uncacheable $b2b_rsc_response;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Cache-Status $upstream_cache_status always;
    # 禁止任何 CDN 缓存 HTML / RSC 页面响应。Cloudflare 忽略自定义 Vary，只认
    # CDN-Cache-Control；缺少这个头时，软导航拉取的 RSC payload 会按同一 URL
    # 污染边缘缓存，普通访问就会拿到 flight 数据（页面乱码）。
    add_header CDN-Cache-Control "no-store" always;
    # RSC/variant separation: ensure intermediaries don't mix HTML and RSC
    add_header Vary "RSC, Next-Router-State-Tree, Next-Router-Prefetch, Next-Router-Segment-Prefetch, Next-Url, Accept-Encoding" always;
  }

  location /_next/static {
    # 优先读本地文件系统（速度快），找不到时降级到 Node 代理
    try_files $uri @nextjs;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }

  location @nextjs {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 管理后台 AI 翻译等长任务可运行到 300s，必须大于该上限，否则保存/翻译报 504
    proxy_read_timeout 360s;
  }

  location /static/ {
    alias /var/www/b2b-independent-site/public/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  location /uploads/ {
    # $uri = /uploads/xxx → root + $uri = /var/www/b2b-independent-site/uploads/xxx (新上传)
    # /public$uri = /var/www/b2b-independent-site/public/uploads/xxx (旧上传)
    root /var/www/b2b-independent-site;
    try_files $uri /public$uri @fallback_uploads;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location @fallback_uploads {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
