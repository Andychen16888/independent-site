# ===============================================================
# Nginx 配置 — Docker 容器内使用
# 挂载位置: /etc/nginx/nginx.conf
# 由 docker-compose.yml 的 nginx 服务引用 (./deploy/nginx.conf)
# ===============================================================
# 注意:
#   - app 通过容器网络名 "app" 访问 (不是 localhost)
#   - SSL 证书挂载自宿主机 ./ssl/ 目录 (全链路 https)
#   - /uploads/ 由共享 volume 提供, 见 docker-compose.yml
# 端口:  80 (HTTP) / 443 (HTTPS)
# ===============================================================

events {
  worker_connections 1024;
}

http {
  client_max_body_size 50M;

  # 图片优化响应缓存：/_next/image 的响应自带 Cache-Control: public, max-age=31536000,
  # immutable，且只按 (url,w,q) 组合变化，非常适合长期缓存，大幅减少 sharp 重复编码的 CPU 消耗。
  # 双核小机上这是峰值 CPU（看帖/爬虫抓图时）的主要来源，缓存命中后 Node 完全不用动。
  # 与宿主版模板 b2b-independent-site.nginx.conf 的 b2b_img 区块保持一致。
  # 注意：nginx 只自动创建 proxy_cache_path 的末级目录，不创建父目录 /var/cache/nginx。
  # 官方 nginx 镜像自带该父目录，通常无需处理；若把缓存挂载到自定义 volume，
  # 请确保宿主机上该目录已存在，否则 nginx 会报
  #   mkdir() "/var/cache/nginx/b2b_img" failed (2: No such file or directory)
  proxy_cache_path /var/cache/nginx/b2b_img levels=1:2 keys_zone=b2b_img:16m
                   max_size=512m inactive=30d use_temp_path=off;

  # HTTP -> HTTPS 强制跳转
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/html;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS
  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 默认代理超时（所有 location 继承）。默认 60s 时保存产品触发 AI 多语言翻译
    # （最长 300s）会导致 "504 Gateway Time-out"；这里放宽到 300s，/api 再放宽到 360s。
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ---- Next image optimizer 缓存（与宿主版模板 b2b-independent-site.nginx.conf 一致）----
    # 最长前缀匹配，本 location 会优先于 / 命中 /_next/image?url=…&w=…&q=…。
    # Next 对最小缓存时长之外的响应带 Cache-Control: public, max-age=31536000, immutable，
    # 这里缓存 30 天，同一张图只让 sharp 编码一次；proxy_cache_lock 防止并发 MISS 重复编码。
    # 命中后 Node（sharp）完全不动，是双核小机上爬虫抓图 / 看帖高峰期 CPU 的主要削减来源。
    location /_next/image {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache b2b_img;
      proxy_cache_key "$scheme$proxy_host$request_uri";
      proxy_cache_valid 200 30d;
      proxy_cache_lock on;
      proxy_cache_lock_timeout 5s;
      proxy_cache_revalidate on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      add_header X-Cache-Status $upstream_cache_status;
    }

    # 主要反向代理
    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # 上传文件 (由共享 volume 提供, app 写入 /app/public/uploads)
    location /uploads/ {
      alias /var/www/uploads-public/;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    # 静态资源直读
    location /_next/static {
      expires 365d;
      add_header Cache-Control "public, immutable, max-age=31536000";
      proxy_pass http://app:3000;
    }

    location /api {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # 管理后台 AI 翻译等长任务可运行到 300s，必须大于该上限，否则保存/翻译报 504
      proxy_read_timeout 360s;
    }
  }
}