# ===============================================================
# Nginx 配置 — Docker 容器内使用
# 挂载位置: /etc/nginx/nginx.conf
# 由 docker-compose.yml 的 nginx 服务引用 (./deploy/nginx.conf)
# ===============================================================
# 注意:
#   - app 通过容器网络名 "app" 访问 (不是 localhost)
#   - SSL 证书挂载自宿主机 ./ssl/ 目录 (全链路 https)
#   - /uploads/ 由共享 volume 提供, 见 docker-compose.yml
# 端口:  80 (HTTP) / 443 (HTTPS)
# ===============================================================

events {
  worker_connections 1024;
}

http {
  client_max_body_size 50M;

  # HTTP -> HTTPS 强制跳转
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/html;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS
  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 主要反向代理
    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_cache_bypass $http_upgrade;
    }

    # 上传文件 (由共享 volume 提供, app 写入 /app/public/uploads)
    location /uploads/ {
      alias /var/www/uploads-public/;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    # 静态资源直读
    location /_next/static {
      expires 365d;
      add_header Cache-Control "public, immutable, max-age=31536000";
      proxy_pass http://app:3000;
    }

    location /api {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }
  }
}