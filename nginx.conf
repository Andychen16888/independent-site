# ===============================================================
# Nginx 配置
# 用途有两个 (二选一):
#   1. 替换 /etc/nginx/nginx.conf (完整配置, 含 events/http)
#   2. 放入 /etc/nginx/sites-enabled/  →  请使用 orient-beauty.nginx.conf (仅 server 块)
# ===============================================================

events {
  worker_connections 1024;
}

http {
  client_max_body_size 50M;

  server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$server_name$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # 使用 Let's Encrypt 证书 (通过 certbot --nginx 自动生成)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    location /_next/static {
      # 优先读本地文件系统（速度快），找不到时降级到 Node 代理
      try_files $uri @nextjs;
      expires 365d;
      add_header Cache-Control "public, immutable";
    }

    location @nextjs {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }

    location /static/ {
      alias /var/www/orient-beauty/public/;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
    }

    location /uploads/ {
      # $uri = /uploads/xxx → root + $uri = /var/www/orient-beauty/uploads/xxx (新上传)
      # /public$uri = /var/www/orient-beauty/public/uploads/xxx (旧上传)
      root /var/www/orient-beauty;
      try_files $uri /public$uri @fallback_uploads;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    location @fallback_uploads {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
